name: Sync legislator rosters

on:
  schedule:
    # 14:45 UTC (~8:45am Central) weekdays optional — adjust as needed
    - cron: "45 14 * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      - name: Refresh generated roster files
        env:
          CONGRESS_GOV_API_KEY: ${{ secrets.CONGRESS_GOV_API_KEY }}
          OPENSTATES_API_KEY: ${{ secrets.OPENSTATES_API_KEY }}
          CONGRESS_API_THROTTLE_MS: "400"
        run: npm run sync:legislators

      - name: Create PR if files changed
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "chore(data): refresh legislator roster exports"
          title: "Automated legislator roster sync"
          body: |
            Generated by `.github/workflows/sync-legislator-rosters.yml`.

            - **U.S. House**: Congress.gov (`CONGRESS_GOV_API_KEY`)
            - **TX House / Senate**: Open States when `OPENSTATES_API_KEY` is set

            Please review names (especially vacancies / specials) against [house.texas.gov](https://house.texas.gov) and [senate.texas.gov](https://senate.texas.gov).
          branch: automated/sync-legislators
          delete-branch: true
