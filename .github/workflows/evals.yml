name: evals

on:
  pull_request:
    paths:
      - '.claude/agents/**'
      - 'standards/**'
      - 'languages/**'
      - 'orchestration/**'
      - 'evals/**'
  push:
    branches: [main]
    paths:
      - '.claude/agents/**'
      - 'standards/**'
      - 'languages/**'
      - 'orchestration/**'
      - 'evals/**'
  workflow_dispatch: {}

jobs:
  eval:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install promptfoo
        run: npm install -g promptfoo

      - name: Detect changed agents (for scoped runs on PRs)
        id: changed
        if: github.event_name == 'pull_request'
        run: |
          changed=$(git diff --name-only origin/${{ github.base_ref }}...HEAD \
            | grep -E '^\.claude/agents/.*\.md$' \
            | sed 's|\.claude/agents/||;s|\.md$||' \
            | sort -u \
            | tr '\n' ' ')
          echo "agents=$changed" >> "$GITHUB_OUTPUT"
          echo "Changed agents: $changed"

      - name: Run full eval suite (push to main / manual trigger)
        if: github.event_name != 'pull_request'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: bash evals/run.sh

      - name: Run scoped eval suite (PR, agents changed)
        if: github.event_name == 'pull_request' && steps.changed.outputs.agents != ''
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: bash evals/run.sh ${{ steps.changed.outputs.agents }}

      - name: Run full eval suite (PR, standards changed)
        if: github.event_name == 'pull_request' && steps.changed.outputs.agents == ''
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: bash evals/run.sh

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: evals/results/
          if-no-files-found: warn
          retention-days: 14
