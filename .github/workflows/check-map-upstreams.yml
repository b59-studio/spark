name: Check map upstreams

on:
  schedule:
    - cron: "30 15 * * *"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      - name: Smoke-test GIS / open data endpoints
        run: npm run check:map-upstreams
