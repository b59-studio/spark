description: architecture-reviewer should produce an ADR-shaped response with alternatives + consequences.

vars:
  agent_prompt: "{{ file:../../../.claude/agents/architecture-reviewer.md }}"
  input: |
    Spec: add a webhook delivery system that lets customers register
    URLs to receive event notifications. Must handle ~10k events/day,
    retry on 5xx with exponential backoff, and surface delivery status
    via an API.

    Existing code: monolith Django app, Postgres, no message queue yet.

    Propose the architecture.

assert:
  - type: icontains-all
    value: ["Context", "Decision", "Alternatives", "Consequences"]
    metric: adr-shape
  - type: llm-rubric
    value: |
      The response is an ADR-shaped design. It (1) picks ONE design,
      (2) names at least TWO alternatives with reasons for rejecting,
      (3) lists consequences (what gets easier, what gets harder), and
      (4) addresses the retry-with-backoff requirement explicitly. It
      does NOT just describe the requirements back at the user.
    metric: complete-adr
