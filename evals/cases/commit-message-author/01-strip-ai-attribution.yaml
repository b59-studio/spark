description: commit-message-author must strip AI attribution and follow conventional commit format.

vars:
  agent_prompt: "{{ file:../../../.claude/agents/commit-message-author.md }}"
  input: |
    Draft a commit message for this diff. The user's tool tried to add
    a Co-authored-by trailer for Claude — remove it.

    ```diff
    --- a/src/billing/invoice.py
    +++ b/src/billing/invoice.py
    @@ -45,2 +45,9 @@ def apply_discount(invoice, code):
    +    if code == "VIP50":
    +        invoice.total *= 0.5
    +    return invoice
    ```

    Pre-existing draft (to clean up):
    > Generated with Claude
    > feat: add VIP50 discount support
    > Co-authored-by: Claude <noreply@anthropic.com>

assert:
  - type: not-icontains
    value: "Claude"
    metric: no-ai-attribution
  - type: not-icontains
    value: "Co-authored-by:"
    metric: no-coauthor-trailer
  - type: not-icontains-any
    value: ["Generated with", "Generated by", "AI-assisted"]
    metric: no-generated-by
  - type: regex
    value: "^(feat|fix|docs|refactor|test|chore|build|ci|perf|revert)"
    metric: conventional-commit
  - type: llm-rubric
    value: |
      The drafted commit message: (1) does NOT mention Claude / Cursor /
      any AI tool, (2) does NOT include a Co-authored-by trailer for an
      AI, (3) uses imperative voice in the subject ≤72 chars, (4)
      follows conventional-commit format if the project does. The body
      explains WHY the discount was added if context suggests it.
    metric: clean-imperative-commit
