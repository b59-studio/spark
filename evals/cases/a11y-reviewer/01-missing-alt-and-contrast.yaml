description: a11y-reviewer should flag missing alt text and insufficient contrast as WCAG 2.2 AA blockers.

vars:
  agent_prompt: "{{ file:../../../.claude/agents/a11y-reviewer.md }}"
  input: |
    Review this React component:

    ```tsx
    export function PromoBanner() {
      return (
        <div style={{ background: "#7a7a7a" }}>
          <img src="/promo.png" />
          <button style={{ color: "#9a9a9a", background: "#7a7a7a" }}>
            Shop now
          </button>
        </div>
      );
    }
    ```

assert:
  - type: icontains
    value: "alt"
    metric: flags-missing-alt
  - type: icontains-any
    value: ["contrast", "1.4.3", "WCAG"]
    metric: flags-contrast
  - type: regex
    value: "(Blocker|Should fix)"
    metric: severity-classified
  - type: llm-rubric
    value: |
      The response identifies BOTH (1) the missing `alt` attribute on the
      <img> tag as a WCAG 1.1.1 failure AND (2) the insufficient text
      contrast (#9a9a9a on #7a7a7a) as a WCAG 1.4.3 failure. It
      classifies both as Blockers and provides specific fixes.
    metric: identifies-both-issues
