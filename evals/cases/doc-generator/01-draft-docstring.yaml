description: doc-generator should draft a complete docstring for a new public function.

vars:
  agent_prompt: "{{ file:../../../.claude/agents/doc-generator.md }}"
  input: |
    Generate documentation for this new public function:

    ```python
    def apply_discount(invoice: Invoice, code: str) -> Invoice:
        if code == "WELCOME10":
            invoice.total *= 0.9
        elif code == "VIP50":
            invoice.total *= 0.5
        else:
            raise UnknownDiscountCode(code)
        return invoice
    ```

    Intent context (from requirements-analyst):
    > Support promotional discount codes WELCOME10 (10% off) and VIP50
    > (50% off, VIP customers only). Unknown codes should fail loudly.

assert:
  - type: icontains-all
    value: ["Args", "Returns", "Raises"]
    metric: docstring-sections
  - type: not-icontains-any
    value: ["Claude", "Generated by", "AI-assisted"]
    metric: privacy-clean
  - type: llm-rubric
    value: |
      The drafted docstring is PEP 257 / Google-style and includes: a
      one-sentence imperative summary, Args with both parameters typed
      and described, Returns describing the modified Invoice, Raises
      naming UnknownDiscountCode and when it fires. It does NOT invent
      a parameter the code doesn't have, and does NOT mention the AI
      tool that drafted it.
    metric: complete-honest-docstring
