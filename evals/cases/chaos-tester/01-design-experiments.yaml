description: chaos-tester should design failure-mode experiments scoped to the service's actual dependencies.

vars:
  agent_prompt: "{{ file:../../../.claude/agents/chaos-tester.md }}"
  input: |
    Design chaos experiments for our checkout service. Dependencies:
    Postgres (RDS), Redis (ElastiCache), Stripe API, internal
    inventory-service (HTTP). Observability: Datadog metrics +
    structured logs. P95 latency target: 400ms; error rate target:
    <0.5%.

    No chaos tooling currently set up.

assert:
  - type: icontains-any
    value: ["Chaos Toolkit", "LitmusChaos", "Toxiproxy", "recommend"]
    metric: recommends-tool
  - type: icontains-all
    value: ["hypothesis", "rollback", "pass"]
    metric: experiment-shape
  - type: llm-rubric
    value: |
      The response (1) recommends a chaos tool (Chaos Toolkit or
      Toxiproxy fit best); (2) designs at least 3 experiments
      scoped to the actual dependencies: Stripe latency injection,
      inventory-service 500s, Redis connection failure or DB pool
      exhaustion; (3) each experiment has a hypothesis (P95 stays
      under target, error rate stays under target), method,
      rollback, and pass criterion; (4) starts with the lowest-
      risk experiment; (5) does NOT propose running against
      production without explicit OK.
    metric: scoped-experiments
