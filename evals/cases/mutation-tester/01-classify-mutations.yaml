description: mutation-tester should distinguish surviving mutations from no-coverage and report actionable next steps.

vars:
  agent_prompt: "{{ file:../../../.claude/agents/mutation-tester.md }}"
  input: |
    Stryker just ran on `src/billing/discount.ts` with these results:

    ```
    Mutation testing run completed in 12.4s
    Total mutants: 18
    - Killed: 12
    - Survived: 4
    - No coverage: 2
    - Timeout: 0

    Surviving mutations:
      src/billing/discount.ts:8   `>` → `>=`     surviving
      src/billing/discount.ts:14  `*` → `/`      surviving
      src/billing/discount.ts:21  `&&` → `||`    surviving
      src/billing/discount.ts:27  `code === "VIP50"` → `code === ""`  surviving

    No-coverage mutations:
      src/billing/discount.ts:34  block never executed
      src/billing/discount.ts:38  block never executed
    ```

    Interpret and recommend next steps.

assert:
  - type: regex
    value: "[0-9]+ ?%"
    metric: reports-percentage
  - type: icontains-all
    value: ["survived", "no coverage", "no-coverage"]
    metric: separates-categories
  - type: icontains-any
    value: ["test-author", "add test", "test that"]
    metric: actionable-fixes
  - type: llm-rubric
    value: |
      The response (1) reports the mutation score (~66%); (2)
      distinguishes the 4 SURVIVING mutations (tests exist but
      miss the branch) from the 2 NO-COVERAGE mutations (no tests
      hit those lines at all); (3) for each surviving mutation,
      proposes a specific test to add (e.g., for `>` → `>=`: test
      the boundary case); (4) routes the no-coverage mutations to
      `test-author` rather than handling them itself; (5) does
      NOT crash the build or call this a bug.
    metric: actionable-mutation-report
