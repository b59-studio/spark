description: perf-reviewer should identify an N+1 query and require P95/P99 reporting, not just averages.

vars:
  agent_prompt: "{{ file:../../../.claude/agents/perf-reviewer.md }}"
  input: |
    Review this code path that's been getting slower in production:

    ```python
    def get_invoices_with_totals(customer_id: int):
        invoices = Invoice.objects.filter(customer_id=customer_id).all()
        result = []
        for invoice in invoices:
            # ORM lazy-loads line_items on access
            total = sum(item.price * item.quantity for item in invoice.line_items)
            result.append({"id": invoice.id, "total": total})
        return result
    ```

    A simple benchmark shows: "average latency 180ms".

assert:
  - type: icontains-any
    value: ["N+1", "N + 1", "lazy load", "prefetch", "select_related", "prefetch_related"]
    metric: flags-n-plus-one
  - type: icontains-any
    value: ["P95", "P99", "p95", "p99", "percentile"]
    metric: requires-percentiles
  - type: llm-rubric
    value: |
      The response (1) identifies the N+1 query in the for-loop where
      line_items is lazy-loaded; (2) recommends prefetch_related or
      equivalent; (3) calls out that "average latency 180ms" is
      insufficient — wants P50/P95/P99 reported instead; (4) ideally
      proposes adding tracing or query-count assertions in tests.
    metric: complete-perf-review
