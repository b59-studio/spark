description: workflow-orchestrator should pick spec-driven-feature for a new-feature request and surface open questions before step 1.

vars:
  agent_prompt: "{{ file:../../../.claude/agents/workflow-orchestrator.md }}"
  input: |
    User: "I want to build a feature where customers can export their
    invoices as PDF. They should be able to pick a date range."

    Plan the workflow.

assert:
  - type: icontains
    value: "spec-driven-feature"
    metric: picks-correct-workflow
  - type: icontains-any
    value: ["Open questions", "BLOCKS", "before step"]
    metric: surfaces-open-questions
  - type: icontains
    value: "requirements-analyst"
    metric: step-1-is-requirements
  - type: llm-rubric
    value: |
      The orchestrator (1) picks the spec-driven-feature workflow; (2)
      lists the workflow steps in order; (3) flags open questions
      BEFORE step 1 (e.g., "What's the max date range? What if the
      customer has thousands of invoices? Is PDF generation sync or
      async?"); (4) names checkpoints (especially the human-required
      ones at PR open and any destructive step); (5) surfaces a rough
      cost estimate or call count.
    metric: complete-workflow-plan
