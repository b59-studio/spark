description: system-documenter should produce a C4-aligned architecture.md with Mermaid diagrams.

vars:
  agent_prompt: "{{ file:../../../.claude/agents/system-documenter.md }}"
  input: |
    Generate docs/architecture.md for this billing system.

    Stack: Next.js web app, FastAPI backend, Postgres, Redis (queue
    + cache), Stripe API, Postmark for email. Deployed on Fly.io.
    There's an existing ADR at docs/adr/0001-postgres-over-mongo.md.

    Most important user journey: checkout (user → web → API → Stripe
    → DB → email confirmation).

assert:
  - type: icontains-all
    value: ["Context", "Container", "sequenceDiagram"]
    metric: c4-shape
  - type: icontains
    value: "mermaid"
    metric: includes-diagrams
  - type: icontains-any
    value: ["troubleshooting", "Where do I look", "Likely module"]
    metric: troubleshooting-section
  - type: llm-rubric
    value: |
      The response is a C4-aligned architecture.md. It contains:
      (1) a Context section with a Mermaid diagram showing the
      system + external dependencies (Stripe, Postmark, Postgres,
      Redis); (2) a Container section decomposing into web/API/
      worker/queue; (3) at least one sequenceDiagram for the
      checkout flow; (4) a "where do I look when…" troubleshooting
      table; (5) links to the existing ADR. It does NOT exceed
      ~600 lines and does NOT include AI attribution.
    metric: complete-architecture-doc
