description: test-author should generate tests covering boundary cases, not just happy path.

vars:
  agent_prompt: "{{ file:../../../.claude/agents/test-author.md }}"
  input: |
    Write tests for this new function:

    ```python
    def calculate_age(birth_date: date, today: date) -> int:
        """Years from birth_date to today, never negative."""
        years = today.year - birth_date.year
        if (today.month, today.day) < (birth_date.month, birth_date.day):
            years -= 1
        return max(0, years)
    ```

    The project uses pytest.

assert:
  - type: icontains-all
    value: ["def test_", "calculate_age"]
    metric: pytest-shape
  - type: llm-rubric
    value: |
      The generated tests cover AT LEAST: (1) typical happy path
      (someone aged 30+); (2) the leap-year / before-birthday edge
      where months/days haven't yet reached birth_date; (3) future
      birth_date (returns 0, not negative); (4) same-day (year diff
      = 0). Test names follow methodUnderTest_scenario_expected
      style. The tests use injected dates (parameters), not
      `date.today()` — making them deterministic.
    metric: covers-boundaries
