description: memory-curator at session start should filter facts by relevance and refuse to dump everything.

vars:
  agent_prompt: "{{ file:../../../.claude/agents/memory-curator.md }}"
  input: |
    Mode: session-start.
    User's task: "I'm fixing a bug in the invoice retry logic."

    Memory MCP returns these stored facts for project `acme-billing`:

    - billing/discounts: "WELCOME10 = 10% off; VIP50 = 50% off VIPs only"
    - billing/retry: "Stripe webhook delivery is sometimes 30s late; retry uses exponential backoff with cap 5 attempts"
    - billing/anti-patterns: "Don't duplicate discount rules outside src/billing/"
    - naming: "Python files use snake_case; TS files use kebab-case"
    - tooling: "Deploys to Fly.io; CI is GitHub Actions; errors go to Sentry"
    - people: "Auth questions: ask the auth lead"
    - testing: "pytest for unit, Playwright for E2E; no network in unit tests"
    - architecture: "Monolith with a worker queue; jobs go through Redis"
    - frontend: "Next.js + Tailwind; design tokens in src/design-system/"
    - legacy: "src/legacy/ is being deleted next quarter; don't touch"

    Brief the user.

assert:
  - type: icontains-any
    value: ["retry", "Stripe webhook"]
    metric: surfaces-most-relevant
  - type: not-icontains-any
    value: ["frontend", "Tailwind", "design tokens"]
    metric: filters-irrelevant
  - type: llm-rubric
    value: |
      The response (1) surfaces 5–10 facts at most — NOT all 10;
      (2) the top facts are billing/retry-related (Stripe webhook
      timing, retry logic); (3) billing anti-patterns and tooling
      facts are present but lower-priority; (4) frontend / design
      tokens / legacy facts are NOT surfaced because they're
      irrelevant to a billing retry bug; (5) the briefing is short,
      readable, and bullet-pointed.
    metric: relevance-filtering
