description: visual-regression-tester should separate intended diffs from unintended drift in its report.

vars:
  agent_prompt: "{{ file:../../../.claude/agents/visual-regression-tester.md }}"
  input: |
    Chromatic ran against the latest PR (titled "Settings page:
    add export button"). Results:

    ```
    Chromatic build: https://chromatic.com/build/xyz
    Snapshots: 47
    Changed: 5
    New: 1
    Missing: 0
    Errors: 0

    Changed snapshots:
      - /pages/settings (light)         - export button added
      - /pages/settings (dark)          - export button added
      - /components/Button/primary      - padding shifted 2px
      - /pages/login                    - heading 1px smaller
      - /pages/billing/invoice          - table row spacing changed

    New:
      - /components/ExportButton/default
    ```

    Interpret.

assert:
  - type: icontains-all
    value: ["intended", "unintended"]
    metric: separates-intended-from-drift
  - type: icontains-any
    value: ["Button", "padding", "login", "invoice"]
    metric: identifies-unrelated-changes
  - type: llm-rubric
    value: |
      The response (1) classifies /pages/settings light+dark and
      the new /components/ExportButton as INTENDED (match PR
      scope); (2) classifies /components/Button/primary (global
      padding shift), /pages/login (heading), and
      /pages/billing/invoice (row spacing) as UNINTENDED — these
      are the high-value catches; (3) hypothesizes WHY the
      unintended changes happened (likely a shared Button or
      typography token changed); (4) defers approval to the human
      rather than auto-approving.
    metric: separates-and-hypothesizes
