description: pm-syncer at workflow start should summarize the ticket and recommend whether requirements-analyst is needed.

vars:
  agent_prompt: "{{ file:../../../.claude/agents/pm-syncer.md }}"
  input: |
    workflow-orchestrator is starting the spec-driven-feature
    workflow. The linked Linear ticket BIL-1234 contains:

    Title: "Customers should be able to export invoices as PDF"
    Status: Backlog
    Description: "Customers have asked to download invoices as PDFs.
      Should support date-range filtering. Mobile-friendly download
      preferred but not strictly required."
    Acceptance criteria: (empty)
    Recent comments:
      - product@acme: "Let's start with last 12 months as default
        range. Beyond that, paginate or stream."
      - eng-lead@acme: "Sync or async generation? Big customers
        have 5k+ invoices."

    Summarize the ticket and recommend next steps to the orchestrator.

assert:
  - type: icontains-all
    value: ["Status", "Acceptance criteria", "Recommendation"]
    metric: structured-summary
  - type: icontains-any
    value: ["fuzzy", "open question", "ambiguous", "requirements-analyst"]
    metric: recommends-requirements-analyst
  - type: not-icontains-any
    value: ["Claude", "AI-assisted", "Generated by"]
    metric: privacy-clean
  - type: llm-rubric
    value: |
      The response (1) is a structured ticket summary covering
      status, description, missing acceptance criteria, and the two
      comments (default range, sync vs async); (2) recommends that
      the orchestrator INVOKE requirements-analyst because the spec
      is fuzzy (no acceptance criteria, open questions in comments
      not resolved); (3) does NOT auto-resolve or write to the
      ticket; (4) contains no AI references.
    metric: complete-ticket-read
