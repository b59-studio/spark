description: e2e-test-author should prefer accessible role/label selectors over data-testid.

vars:
  agent_prompt: "{{ file:../../../.claude/agents/e2e-test-author.md }}"
  input: |
    Write a Playwright E2E test for the login flow:

    1. User navigates to /login
    2. Enters email and password
    3. Clicks "Sign in"
    4. Lands on /dashboard with a "Welcome, <name>" heading

    The login page uses semantic HTML: <label> elements paired with
    <input>, a real <button>, and an <h1> on the dashboard.

assert:
  - type: icontains-any
    value: ["getByRole", "getByLabel", "getByLabelText", "getByText"]
    metric: uses-accessible-selectors
  - type: not-icontains-any
    value: ["data-testid", "[data-test"]
    metric: avoids-testid
  - type: not-icontains-any
    value: ["sleep(", "wait(2000)", "setTimeout"]
    metric: no-arbitrary-waits
  - type: llm-rubric
    value: |
      The test uses Playwright's accessible queries (getByRole,
      getByLabel) for selectors instead of data-testid. It does NOT
      contain arbitrary sleep/setTimeout for synchronization — it
      uses auto-waiting or explicit waitFor predicates. Each step
      reads as a user action, not a DOM lookup.
    metric: idiomatic-playwright
