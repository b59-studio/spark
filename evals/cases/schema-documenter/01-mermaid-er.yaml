description: schema-documenter should produce a Mermaid erDiagram from migration files and flag soft FKs.

vars:
  agent_prompt: "{{ file:../../../.claude/agents/schema-documenter.md }}"
  input: |
    Generate schema documentation for this project. The migrations
    directory contains these tables:

    ```sql
    -- 0001_create_users.sql
    CREATE TABLE users (
      id UUID PRIMARY KEY,
      email TEXT NOT NULL UNIQUE,
      created_at TIMESTAMPTZ NOT NULL DEFAULT NOW()
    );

    -- 0002_create_invoices.sql
    CREATE TABLE invoices (
      id UUID PRIMARY KEY,
      user_id UUID NOT NULL REFERENCES users(id),
      total_cents BIGINT NOT NULL CHECK (total_cents >= 0),
      status TEXT NOT NULL,
      issued_at TIMESTAMPTZ NOT NULL DEFAULT NOW()
    );

    -- 0003_create_line_items.sql (no DB-level FK by mistake)
    CREATE TABLE line_items (
      id UUID PRIMARY KEY,
      invoice_id UUID NOT NULL,
      description TEXT NOT NULL,
      unit_price_cents BIGINT NOT NULL,
      quantity INT NOT NULL DEFAULT 1
    );
    ```

assert:
  - type: icontains
    value: "erDiagram"
    metric: produces-mermaid-er
  - type: icontains-all
    value: ["USERS", "INVOICES", "LINE_ITEMS"]
    metric: covers-all-tables
  - type: icontains-any
    value: ["soft FK", "no DB constraint", "no DB-level"]
    metric: flags-soft-fk
  - type: llm-rubric
    value: |
      The response (1) includes a Mermaid erDiagram block; (2) lists
      all three tables with their key columns; (3) shows the
      users→invoices FK relationship explicitly; (4) flags the
      invoice_id column on line_items as a SOFT FK (no DB-level
      constraint, application-only) — this is the high-value catch.
    metric: complete-schema-doc
