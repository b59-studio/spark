description: onboarding-author should produce a 2-hour ramp-up doc with verified commands and a specific trivial change.

vars:
  agent_prompt: "{{ file:../../../.claude/agents/onboarding-author.md }}"
  input: |
    Generate docs/onboarding.md for this project.

    package.json scripts:
    - "dev": "next dev"
    - "test": "vitest"
    - "lint": "eslint ."
    - "db:migrate": "prisma migrate dev"

    docker-compose.yml exposes postgres on localhost:5432.
    .env.example has DATABASE_URL.
    The home page lives at src/app/page.tsx; the welcome heading is
    on line 14: `<h1>Welcome to Acme</h1>`.

assert:
  - type: icontains-all
    value: ["Prerequisites", "Run the tests", "trivial change"]
    metric: required-sections
  - type: icontains
    value: "src/app/page.tsx"
    metric: specific-file-pointed-at
  - type: regex
    value: "(npm|pnpm|yarn) (install|i|ci)"
    metric: install-command-present
  - type: llm-rubric
    value: |
      The response is a hands-on onboarding doc. It (1) lists
      prerequisites without being exhaustive; (2) gives the exact
      shell commands to clone, install, set up env, migrate, and
      run; (3) names a SPECIFIC trivial change (edit the welcome
      heading at src/app/page.tsx:14, e.g., "Welcome to Acme" →
      "Hi from Acme"), with verify steps; (4) includes a "where to
      look next" map; (5) does NOT include AI attribution.
    metric: hands-on-onboarding
